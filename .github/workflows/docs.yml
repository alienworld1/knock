name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Publish Linux release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      downloads: ${{ steps.downloads.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build Astro Starlight site
        run: pnpm --dir docs build

      - name: Add the published Linux downloads
        id: downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq 'length')
          if [[ "$published" == 0 ]]; then
            echo "::notice::Pages will deploy after the first Linux release is published."
            exit 0
          fi
          gh release download --pattern knock-linux-amd64.tar.gz --pattern SHA256SUMS --dir docs/dist/downloads
          (cd docs/dist/downloads && sha256sum -c SHA256SUMS)
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.downloads.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: needs.build.outputs.downloads == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
